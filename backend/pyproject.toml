[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkceprep-ai-backend"
version = "1.0.0"
description = "TürkçePrep AI (Aylin Hoca) — turkcha og'zaki nutq simulatorining FastAPI backendi"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "edge-tts>=6.1.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]
